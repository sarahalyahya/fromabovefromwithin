<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From above from within</title>
<link rel="stylesheet" href="style.css">
<script type="module">
  import { ModelViewerElement } from 'https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js';
  ModelViewerElement.meshoptDecoderLocation = 'assets/meshopt_decoder.js';
</script>
</head>
<body>

<div id="gate">
    <button id="launch" type="button">Launch</button>
</div>

<main id="film">

  <section class="scene" data-scene="opening" data-screens="3" data-register="satellite">
    <div class="stage">
      <!-- <p class="prose">text text text text </p> -->
      <model-viewer class="fill" src="assets/beaufort-optimized.glb" camera-controls disable-zoom interaction-prompt="none"  exposure="0.9" shadow-intensity="0" environment-image="neutral" camera-orbit="0deg 75deg 70%" orientation="0deg -90deg 0deg" field-of-view="35deg"> </model-viewer>
    </div>
  </section>

  <section class="scene" data-scene="resolution" data-screens="3" data-register="satellite">
    <div class="stage">
      <!-- <img class="fill" src="assets/img/sat.jpg" alt=""> -->
      <p class="prose"></p>
    </div>
  </section>

  <section class="scene" data-scene="archive" data-screens="3" data-register="satellite">
    <div class="stage">
      <p class="prose"></p>
    </div>
  </section>

  <section class="scene" data-scene="hover" data-screens="3" data-register="commercial drone">
    <div class="stage">
      <p class="prose"></p>
    </div>
  </section>

  <section class="scene" data-scene="survey" data-screens="3" data-register="commercial drone">
    <div class="stage">
      <p class="prose"></p>
    </div>
  </section>

  <section class="scene" data-scene="the-stack" data-screens="3" data-register="armed drone">
    <div class="stage">
      <p class="prose"></p>
    </div>
  </section>

  <section class="scene" data-scene="strike" data-screens="3" data-register="armed drone">
    <div class="stage">
      <p class="prose"></p>
    </div>
  </section>

  <section class="scene" data-scene="handheld" data-screens="3" data-register="soldier">
    <div class="stage">
      <p class="prose"></p>
    </div>
  </section>

  <section class="scene" data-scene="descent" data-screens="3" data-register="the crevice">
    <div class="stage">
      <p class="prose"></p>
    </div>
  </section>

  <section class="scene" data-scene="beneath" data-screens="3" data-register="the crevice">
    <div class="stage">
      <p class="prose"></p>
    </div>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
